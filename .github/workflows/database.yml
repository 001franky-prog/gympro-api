name: Gym Pro database verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: PostgreSQL 18 full verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://gympro_app@127.0.0.1:1/gympro_saas
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npx --no-install prisma generate
      - name: Build API
        run: npm run build
      - name: Full suite and isolated database verification
        run: node tools/ci/database-ci.mjs
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package-lock.json
