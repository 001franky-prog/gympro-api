<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gym Pro · My sessions</title><link rel="stylesheet" href="/account/sessions/style.css"><script src="/account/sessions/app.js" defer></script></head><body><main><p class="brand">GYM PRO / ACCOUNT</p><h1>My sessions</h1><p>Manage active sign-ins for your account in this gym. Up to 100 latest active sessions are shown.</p><p id="status" role="status">Sign in to view sessions.</p><form id="login"><label>Gym identifier<input id="tenant" required autocomplete="off"></label><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><section id="workspace" hidden><div class="actions"><button id="refresh">Refresh sessions</button><button id="others">Revoke other sessions</button><button id="logout">Sign out</button></div><p>“This session” is the browser sign-in used by this page. Revoking it signs this page out.</p><div class="scroll"><table><thead><tr><th>Session</th><th>Created</th><th>Expires</th><th>Action</th></tr></thead><tbody id="sessions"></tbody></table></div></section></main></body></html>
